name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest

    outputs:
      projects: ${{ steps.projects.outputs.matrix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Discover projects
        id: projects
        run: |
          # Every service project under projects/ plus a `dev` entry that runs
          # the whole workspace. The dev entry is the important one: it is the
          # only entry that exercises every brick, including those no service
          # project includes. Matrix entries run as parallel jobs.
          #
          # Library projects (mono-lib, mono-test-lib) are excluded: they have
          # no base and no tests of their own, so there is nothing for the test
          # runner to do. Their bricks are covered by the dev entry, and the
          # projects themselves are validated by `poly check` below.
          matrix=$(ls projects/ | grep -v -- '-lib$' | jq -Rc '[., inputs] + ["dev"]')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Discovered projects: $matrix"

  # Validates the whole workspace, including the base-less library projects
  # that the test matrix skips. Needs no Docker: poly check is static analysis.
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-

      - name: Check workspace
        # With the profile, because an unactivated profile's bricks are
        # invisible to check.
        run: clojure -M:poly check +realworld

      - name: Resolve published library artifacts
        run: |
          # Each artifact must build a classpath standalone, the way a
          # consumer's :deps/root resolve will.
          for project in mono-lib mono-test-lib; do
            echo "Resolving $project..."
            (cd "projects/$project" && clojure -Spath > /dev/null)
          done

  test:
    needs: discover
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}

    name: test (${{ matrix.project }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Install lcov
        run: |
          set -euo pipefail
          sudo apt-get install -y lcov
          sudo sed -i 's/lcov_branch_coverage/branch_coverage/' /etc/lcovrc

      - name: Verify Docker
        run: |
          docker --version
          docker ps

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-

      - name: Run tests
        env:
          TESTCONTAINERS_REUSE_ENABLE: "true"
          COVERAGE: "true"
          COVERAGE_THRESHOLD: "50"
          JUNIT_NS_PREFIX: "com.repldriven.mono."
        run: |
          clojure -M:poly test project:${{ matrix.project }} :all +realworld

      - name: Publish test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Results (${{ matrix.project }})
          path: target/test-results/**/*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.project }}
          path: target/test-results/**/*.xml
          retention-days: 7

      # Polylith writes coverage to `target/coverage/<project-name>/` using the
      # project NAME, not its alias. The dev matrix entry is the alias, so its
      # path is `target/coverage/development/`, not `target/coverage/dev/`.
      # The ternary keeps a single workflow expression for every entry.
      - name: Report coverage
        if: always()
        uses: zgosalvez/github-actions-report-lcov@v7.1.0
        with:
          coverage-files: target/coverage/${{ matrix.project == 'dev' && 'development' || matrix.project }}/lcov.info
          minimum-coverage: 50
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true
          title-prefix: "[${{ matrix.project }}]"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.project }}
          path: target/coverage/${{ matrix.project == 'dev' && 'development' || matrix.project }}/
          retention-days: 7

  # Gate job for branch protection — produces a single required check
  tests:
    if: always()
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.check.result }}" != "success" ]]; then
            echo "Workspace check failed or was cancelled"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Tests failed or were cancelled"
            exit 1
          fi
